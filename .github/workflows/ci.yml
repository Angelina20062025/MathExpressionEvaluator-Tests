name: CI - Generate & Run NUnit Tests

on:
  push:
    branches: [ "main", "ai-version-1", "ai-version-2", "ai-version-3" ]
  workflow_dispatch:

jobs:
  test-generation-and-execution:
    runs-on: ubuntu-latest

    steps:
    #Получение кода
    - name: Checkout repository
      uses: actions/checkout@v4

    #Настройка Python для генератора
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install pyyaml

    #Генерация тестов из спецификации
    - name: Generate NUnit tests from spec
      run: python generator/gen_tests.py --config config.yaml

    #Настройка .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    #Восстановление пакетов
    - name: Restore dependencies
      run: dotnet restore

    #Сборка проекта
    - name: Build
      run: dotnet build --no-restore --configuration Release

    #Запуск тестов (оригинальные + сгенерированные)
    - name: Run tests
      run: dotnet test --no-build --verbosity normal --logger "console;verbosity=detailed"

    #Сохранение сгенерированных тестов как артефакт
    - name: Upload generated tests
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: generated-tests
        path: tests/Generated/

    #Сохранение результатов тестов
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/TestResults/
          **/*.trx